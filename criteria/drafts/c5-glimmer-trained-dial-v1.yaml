outputs:
  raw: results/raw/<run_id>/ (STARTED.json; adapter.pt and training.json; phaseA.json with the adapter and perplexity-path checks; one book_<set>_<id>.json per book with, per scale and period, per-head target magnitude and noise floor, noise-bin power summed over heads, realized and nominal input component and realized-drive statistics; per scale the amplitude reference, perplexity and sham count; a record of seal, code, platform, adapter and text hashes; recall.json; any ATTEMPT and FAILED records). Every file is written atomically and never overwritten.
  derived: results/derived/<run_id>/c5_summary.json and c5_curves.png, citing every raw file used
