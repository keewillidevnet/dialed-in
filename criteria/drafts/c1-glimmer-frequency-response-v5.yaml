outputs:
  raw: results/raw/<run_id>/ (STARTED.json; phaseA.json; one book_<set>_<id>.json per book with, per N, per-head target magnitude and noise floor, noise-bin power summed over heads, realized and nominal input component, the same for the control phase, and realized-drive statistics; a record of seal, code, platform, text and token hashes; any *.ATTEMPT.<utc>.json and *.FAILED.<utc>.json records). Every file is written atomically and never overwritten.
  derived: results/derived/<run_id>/c1_summary.json and c1_curves.png, citing every raw file used
