adapter:
  file: results/raw/c5v1-20261029T025343Z/adapter.pt
  sha256: 2b20e86e9af79b81dc881bbedbef350331a24ef8ee1d541183ba6bac035d9f20   # as C6 v2 and C8; the runner refuses to start, before STARTED.json, unless the file, this value and results/raw/c5v1-20261029T025343Z/training.json adapter_sha256 all agree
  family: all
  layers: [2, 3, 4, 5]
  rank: 8
  alpha: 16.0
  frozen: no training; the adapter is loaded as C5 trained it

conditions:
  BASE: {scale: 0.0, modules: all}  # Glimmer itself; every module's branch is skipped at scale 0
  FULL: {scale: 2.0, modules: all}  # all 32 modules on
  V2:
    scale: 2.0
    modules: [layers.2.self_attn.v_proj]
  NOV2:
    scale: 2.0
    modules: {all_except: [layers.2.self_attn.v_proj]}   # 31 modules on
  NOV4:
    scale: 2.0
    modules: {all_except: [layers.4.self_attn.v_proj]}   # 31 modules on
  NOG2:
    scale: 2.0
    modules: {all_except: [layers.2.self_attn.gate_proj]}   # 31 modules on; the attention output gate, not the MLP's
  switching: >
    A module is off when its B factor is set to zero; its branch then adds exactly zero. Switching a condition copies
    each on module's saved B back, so every condition sees the trained values bit for bit (checked). The scale is the
    shared C5 dial value. all_except names modules to switch off; every other adapter module is on. Every non-BASE
    condition switches on a different set of modules (checked).
  order_per_book: BASE, FULL, V2, NOV2, NOV4, NOG2; each gets its own undriven pass (with perplexity) and sham
  setup_checks: >
    At the start of Phase A, on the first 2,048 tokens of book 1342 (from the start of the stripped text), layer 10's
    o_proj input: BASE must equal the unadapted model's (recorded before the adapter is attached) bit for bit; every
    other condition must differ from BASE and from every other condition; FULL again after the masked conditions must
    equal the first FULL bit for bit, and BASE again the first BASE. Perplexity path: under BASE, the logits must
    match the full model's own logits to within 0.5 percent of the largest absolute logit. If a check fails,
    phaseA.json is written and C9 is not run, outcome U.
  perplexity: >
    On every undriven pass, exp of the mean next-token loss over predictions of the segment's tokens 8,193 to 32,767
    (as C5 and C8). Per condition, the median over books of the ratio to BASE. Reported, not gated.

drive:
  injection_point: residual stream output of decoder layer 1
  measured_layers: 2 to 51 (37 local, 13 global)
  direction: one unit vector in the 6,656-dim residual space, torch.randn on CPU with torch.Generator seeded 0, float32, divided by its norm
  waveform: at every segment position t = 0 .. 32767, add A * cos(2 pi t / N) * direction, A = a times the amplitude reference, phase 0 (C1 v5's main drive)
  add: computed in float32, cast once to bfloat16; zero products keep the stored value; the realized drive along the direction is used for the input component (src/dialedin/wave.py, sealed with C1 v5)
  amplitude: a = 0.1, the value C1 v5's sealed Phase A chose; amplitude reference = median per-token residual norm at the layer 1 output from that condition's own undriven pass (the adapter sits in later layers, so this is the same under every condition, and is recorded)
  periods_N: [2, 4, 16, 64, 256, 1024, 4096]
  phase_A: >
    On book 1342's segment, after the setup checks, under every condition (BASE, FULL, V2, NOV2, NOV4, NOG2): one
    undriven pass, then A and 2A at N = 2 and 4096 (one sham, after BASE's undriven pass, which it is compared
    against). A condition passes if the 2A/A response ratio is within 10 percent of 2 at both N and the whole-model
    SNR at A, N = 4096 is at least 3. If any fails, stop: C9 is not run, outcome U.
  controls:
    sham: zero wave, under every condition of every book, plus a closing sham per book; every head-output value must have the same bits as that condition's undriven pass (int16 view), or the run stops and the book is not written
    reproduction: not applicable; no earlier run measured this segment, so BASE has no earlier record to match

measurement:
  read_point: forward pre-hook on self_attn.o_proj (gated head outputs, 32 heads x 128), layers 2 to 51 as in C1 v5
  response: driven minus undriven head output, per head, per token, computed in float32
  window: >
    One window for every N: segment positions [8192, 32768), W = 24576. Every period N divides W,
    so the target bin k0 = W / N is a whole number (smallest k0 = 6 at N = 4096). The
    first 8192 positions are a burn-in, four times the sliding window.
  operator: >
    Per head dimension: remove the least-squares line a + b t over the window, multiply by
    a periodic Hann window, and take the Fourier sum at each analysis frequency. The same
    operator is applied to the input drive, so a pass-through head has gain 1 (tested to 1e-5 in float32).
    Line removal biases gain by under 0.1 percent on this grid (tested).
  target_component: per head, the norm over its 128 dims of the operator output at frequency 1/N
  input_component: the operator output at 1/N for the realized drive along the direction (what bfloat16 actually stored); the nominal component of w_t is recorded beside it
  gain: target_component divided by input_component
  noise_bins: >
    Integer bins k in (0, W / 2], excluding every bin within 1 of a multiple of k0 (DC
    included): the up to 8 nearest below k0 and the 8 nearest above. At N = 4096 only 3 lie
    below (k = 2, 3, 4); at least 3 are required. At N = 2 the target is
    the Nyquist bin, so the 16 nearest below are used. Hann leakage from any harmonic reaches
    only its two neighbor bins, which are excluded.
  floor_rule: >
    Two-sided floor = the larger of the median over the bins below k0 and the median over
    the bins above k0 (at N = 2, the median of all 16). Smooth drift leaks mostly into low
    bins, so a floor taken only above k0 would let drift pass as signal at long N (tested
    with log, inverse, square, square-root and exponential drifts: all stay below SNR 1).
  noise_floor_per_head: two-sided floor of the head's noise-bin magnitudes (diagnostics only)
  snr: >
    Whole-model SNR per book and N: sqrt(sum over all 1,600 measured heads of target power,
    divided by the two-sided floor of the noise-bin power summed over all heads).
  validity: >
    Per condition, a period counts for the set only if the median over the set's five books of
    the whole-model SNR is at least 3. Invalid periods are excluded from the tilt for
    that condition and listed in the output.
  curves:
    main: per book, mean gain over all heads in layers 2 to 51 (whole), per N; per set, the mean over its five books of each book's curve
    downstream: the same over the heads in layers 5 to 51 only
    per_condition: every curve is computed separately for each condition

tilt:
  definition: the least-squares slope of ln(set-mean gain) against ln(N) (metrics_c2.tilt, sealed with C2), fit over the periods valid under every condition (validity from the whole-model SNR, as above); a tilt needs at least 5 of the 7 periods valid, otherwise it is undefined
  main: from the main curves (heads in layers 2 to 51), the whole-model tilt of C1 to C8
  downstream: from the downstream curves (heads in layers 5 to 51), over the same periods as the main tilt; the same as C8's diagnostic_groups.layers5_51
  book_tilts: each book's main and downstream tilts per condition from its own curves, over the periods valid in that book under every condition (same 5-period minimum)

pass_criteria:
  retained: for a condition X and a window, (tilt(X) - tilt(BASE)) / (tilt(FULL) - tilt(BASE)), set-level tilts; the fraction of the full dial's change that X keeps
  outcome_U: any of the six main tilts undefined, main tilt(BASE) not positive, or (tilt(FULL) - tilt(BASE)) / tilt(BASE) above -0.15 over the main window (the floor of C8)
  replication_gate_main: retained(V2) over the main window between 0.40 and 1.40 inclusive; if not, outcome R0 and necessity is not judged
  main_passes: retained(NOV2) at most 0.60, retained(NOG2) at least 0.80, and at least 4 of 5 books order them (in a book, FULL flattens the main tilt and NOV2 keeps less of that book's change than NOG2)
  downstream_judged: every downstream tilt defined, downstream tilt(BASE) positive, FULL flattens the downstream tilt by at least 2.5 percent, and retained(V2) over layers 5 to 51 between 0.20 and 1.40 inclusive
  downstream_passes: judged, retained(NOV2) over layers 5 to 51 at most 0.70, and retained(NOV4) over layers 5 to 51 at least 0.80
  outcome_N1_necessary_in_both_windows: main passes and downstream passes
  outcome_N1L_necessary_in_main_window_only: main passes; downstream fails or is not judged (the reason is recorded)
  outcome_N0_not_shown_necessary: replication gate met, main window fails (the reason is recorded, as NOV2 keeping too much, NOG2 keeping too little, or too few books)
  outcome_R0_no_replication: every main tilt defined, FULL flattens enough, V2 alone outside 0.40 to 1.40 over the main window
  control_limits: >
    NOG2 drops a module in the same layer that acts before the read point (the gate multiplies the head outputs that
    o_proj receives), so it can reach layer 2's own heads as NOV2 can; it matches position, not type. The deep probe
    expects it to keep about all of the change, so passing it shows only that not every layer 2 attention module that
    reaches the heads is needed. (Layer 2's o_proj was not used: its adapter changes only o_proj's output, after the
    read point, so dropping it cannot touch layer 2's heads.) NOV4 drops the same module type one local layer later; it can move only layers 4 to 51,
    so it is compared with NOV2 only over layers 5 to 51, which both can reach. It is expected to keep about 0.94
    there; a fail would most likely come from noise in a small denominator (C8's FULL moved layers 5 to 51 by a tilt
    difference of about 0.007), not from layer 4's v. Neither control matches both type and
    position; no single module does. The claim is about the trained C5 adapter's modules, not about v_proj in a model
    with no adapter.
  incomplete_run: if any of the 5 books lacks a valid record, there are no outcomes; a partial look is written to results/derived/<run_id>-PARTIAL-<UTC timestamp>/ with a warning field (a run with no book file is refused), its outcome object is kept under C9.partial_diagnostic with C9.outcome null, and it is never reported as C9
  every_run_reported: every run under this seal is reported; a run that is never finished is reported as unfinished
  secondary: >
    Reported, never gated, pre-registered: FULL's relative change over both windows (against C8's -26.4 and -4.6
    percent); retained(NOV4) over the main window; V2 alone minus what removing it loses, retained(V2) - (1 -
    retained(NOV2)), over the main window (zero if v's part adds without overlap); per-book tilts and retained shares
    in both windows, and the mean of per-book retained shares for NOV2, NOV4 and NOG2 in both windows (Muse Wonder's
    proposed metric); median perplexity ratio per condition; set-level tilts and retained shares over (a) layer 2's
    heads, (b) layers 3 to 51, (c) layers 5 to 51, (d) layers 6 to 51. Headline: retained(NOV2) over the main window
    with its bootstrap interval.

uncertainty:
  bootstrap: >
    Resample the five books with replacement 1,000 times (numpy default_rng([0, 0])); for each resample recompute
    validity, curves and tilts in both windows. Report 95 percent percentile intervals of FULL's relative change in
    both windows, retained(V2), retained(NOV2), retained(NOV4) and retained(NOG2) over the main window, and
    retained(V2), retained(NOV2) and retained(NOV4) over layers 5 to 51. Main shares are taken only from resamples where
    FULL flattens the main tilt by at least 15 percent, downstream shares only where it flattens layers 5 to 51 by at
    least 2.5 percent. Each window is judged on its own: a resample drops a window's numbers only when that window has
    an undefined tilt or tilt(BASE) not positive (both windows use the periods valid in that resample). The number of
    resamples used is reported per quantity.
  not_covered: one adapter from one training seed; one probe direction; the bootstrap covers books only; one book set (set A, the books C5 measured), so book-level generalization rests on C8's set C

decisions:
  N1: inside the full dial, layer 2's v_proj is necessary for a large part of the change in both windows. Without it the dial keeps at most 60 percent over layers 2 to 51 and at most 70 percent over layers 5 to 51, while dropping layer 2's output gate (same layer) or layer 4's v_proj (same type) keeps at least 80 percent of their window's change. With C8, layer 2's v_proj is both enough for a majority and needed for a large part
  N1L: necessary over layers 2 to 51 against the same-layer control, not shown over layers 5 to 51 (the reason is recorded); the claim stays with layer 2's window
  N0: not shown to be necessary (the reason is recorded); the other modules can carry the change without it, or the same-layer control also loses too much, or too few books agree
  R0: C8's sufficiency result does not hold on this segment; necessity is not judged; reported as a failure of C8 to replicate on new text
  U: inconclusive; reported as is
  no_rescue: other module sets, scales, layers, books, segments, periods, amplitudes or analysis code cannot be used to rescue a result
  restarts: >
    One complete run per sealed version, and one runner process at a time (a lock file in results/ledger/). A new
    run writes STARTED.json before any GPU work and is refused if any earlier run under the seal is complete or was
    stopped by rule in Phase A; otherwise a new run needs a written reason (an infrastructure failure). A run is
    continued with --run-id; only the newest run may continue; a Phase A retry after a failure record, and every book
    with an earlier attempt or failure record, need a written reason, stamped on the record. Continuing a run that has
    any failure record (startup or Phase A) and no phaseA.json needs a written reason, which is stamped into phaseA.json
    with the list of earlier failure records. All records are kept.
    Before admission (so a failure leaves no run): seal and code hashes, condition names and scales, no placeholder
    left in this file, the adapter hash against this file and C5's training.json, and every text hash. The model load
    and platform preflight run after STARTED.json; a failure there is an infrastructure failure. The analysis
    refuses to run if more than one run under the seal is complete, requires phaseA.json (not stopped, condition
    modules as sealed), and never overwrites a summary.

budget:
  max_gpu_hours: 2.0                # wall-clock hours of every run process under this seal, including model loads
  ledger: results/ledger/c9v1_<first 12 of seal hash>.jsonl, append-only, one line per step; outside results/raw/
  ledger_limit: >
    A step is written to the ledger when it ends, so a process killed during a step loses that step's time from the
    count: at most one model load (71 s in C8's smoke) or one pass (about 14 s) per killed process. With the estimate
    below, the 2.0-hour cap leaves about 0.75 hours of headroom.
  seconds_per_pass_estimate: 14     # used only for the Phase A preflight; Phase B uses the measured pass time
  estimate: >
    The same pass count as C8: Phase A 31 passes and 11 short check passes; Phase B 5 books x 55 passes = 275. C8's
    run measured 13.6 wall seconds per pass and about 740 s per book, and used 1.15 hours in all
