  length_tokens: 32768
  segment_start_token: 32768
  start: token 32,768 of the main text, after the Project Gutenberg header is stripped (token ids 32,768 to 65,535 of the stripped text)
  special_tokens: none (no BOS); input = token ids [32768, 65536) of the stripped text; the model sees no earlier text
  prompt_sets:
    A: {1342: Pride and Prejudice, 2701: Moby Dick, 1400: Great Expectations, 145: Middlemarch, 1184: The Count of Monte Cristo}
  why_this_text: >
    No tilt has been measured on set A at tokens 32,768 to 65,535: C1 v5, C4 and C5 measured set A's first 32,768
    tokens; the band-mute probe used set A at tokens 70,000 to 78,191; C5's pilot used Moby Dick at tokens 98,304 to
    139,263, and C5's recipe was tuned on pilots that trained and evaluated on that book. The adapter never trained on set A (C5 trained on books 1260, 345, 37106 and 174 only). C5's exploratory
    behavior tests read losses, not tilts, on set A inside this segment (recall contexts from token 40,000; topic
    switch at tokens 53,856 to 62,047), and nothing in C9's design was chosen from them. Same books as C5, so only the
    token segment is new; book-level generalization is not tested here (C8 tested set C).
  token_counts_checked: 2026-10-26 for all 15 books (C5 spec), shortest 94,774 tokens (book 120, set C), so every set A book has at least 65,536; the smoke run prints each count
  text_manifest: /workspace/data/books/MANIFEST.json
  text_sha256:                      # gutenberg_id -> sha256 of the stripped text, from the manifest; all 15 sealed as in C5 and C8, set A measured
    1342: cb7c0d9af2041d31e655fafe79becb0877c3fc775690c7a558eb8707035e5138
