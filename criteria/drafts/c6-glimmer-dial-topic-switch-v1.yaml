# C6: does the dial change topic-switch recovery? v1 (confirmatory)
# DRAFT. Follows C5 (sealed; run c5v1-20261029T025343Z: outcome L0, tilt -24.0 percent at scale 2 against a 25 percent
# bar; Spearman -1.00; 5 of 5 books; perplexity at most x1.008; tilt over unadapted layers 6 to 51 only -2.7 percent).
# C5's exploratory behavior phase (results/raw/c5v1-20261029T025343Z/behavior.json) found that the adapter's scale
# raised the excess next-token loss after a switch to a different book at every step: 509.6, 517.9, 532.0, 547.2 and
# 567.5 nats at scales 0, 0.5, 1, 1.5 and 2 (+11.4 percent), mostly after the first 64 tokens, on set A, 20 pairs.
# The opposite direction had been written down as the expectation before that run. C6 tests the finding as a
# confirmatory, gated outcome on text C5 never measured, with the same adapter, frozen and hash-checked: no training.
# Every value is a proposal until Keenan seals this file with scripts/seal.sh.

id: c6-glimmer-dial-topic-switch-v1
version: 1
drafted: 2026-10-29
follows: c5-glimmer-trained-dial-v1 (sealed, run complete, outcome L0)
status: draft

question: >
  With the C5 adapter at scales 0, 0.5, 1, 1.5 and 2, does the excess next-token loss after a topic switch rise with
  the scale on new text (sets B and C, tokens 60,000 to 68,191), by at least 5 percent at scale 2, for at least 8 of
  the 10 target books?
prediction: the excess rises with the scale, by about 10 percent at scale 2 (C5's exploratory value, 11.4 percent).

platform:
  model: meta-models/Muse-Glimmer-30B
  revision: cec94fcfd651            # full hash in /workspace/weights/DOWNLOAD_LOG.txt
  loader: AutoModelForMultimodalLM
  precision: bfloat16               # no quantization_config
  attention: sdpa
  transformers: "5.21.0"
  torch: "2.8.0+cu128"
  gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
  batch_size: 1                     # every pass, so undriven and driven runs use identical kernels
  deterministic: torch.use_deterministic_algorithms(True, warn_only=False) so any op without a deterministic implementation stops the run; CUBLAS_WORKSPACE_CONFIG=:4096:8, TF32 off, fixed seeds
  allocator: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  preflight_must_pass: [dtype_bf16, no_quantization, sdpa, batch_size_1, revision_match, versions_match, gpu_match, layer_layout, seal_hash_match, code_hash_match, text_hash_match, budget_projection]

inputs:
  prompt_sets:                      # 10 books; C5's behavior phase used set A only
    B: {1260: Jane Eyre, 768: Wuthering Heights, 345: Dracula, 84: Frankenstein, 25344: The Scarlet Letter}
    C: {37106: Little Women, 74: The Adventures of Tom Sawyer, 120: Treasure Island, 174: The Picture of Dorian Gray, 940: The Last of the Mohicans}
  text_manifest: /workspace/data/books/MANIFEST.json
  text_sha256:                      # gutenberg_id -> sha256 of the stripped text, from the manifest
    1342: cb7c0d9af2041d31e655fafe79becb0877c3fc775690c7a558eb8707035e5138
    2701: 6b74a36cf4b629ac137c8832b2ba2be071a02c348f3accde0c026a893a2f30eb
    1400: c6196113039a054e075999518fd4f081838335b58cc0371f04b99080de03e7fe
    145: 9d0ce5c0b701c05b38198f6fab45b8ebf2eb3645a81aa55794ccd0aa66cdaf0d
    1184: ea17c0e73310be451ea977324ff72be950aa63ae76b95eac946386cfb8f97045
    1260: 67453a6d7b7ebe4c3f4525bea71e5564ca1562eb4c62c01e8e086d65370627e1
    768: d23b4feab29dcfa7411bbb8041e825dd48e3e1c1721c61c392ccfb46968fd6fd
    345: f20fc68a26f548cbc0c7ea33129b0d65dffb6cbd9f5d382fde64837dea445fc3
    84: 3839fa35c116713f811903545470041a86079268307ae9fd3ed4d04c88788bc0
    25344: 47e262c46b86b85f8cb5f830366396dc47f9c4e0a2ab7625390231afa290111a
    37106: c0e400eaac9e8e3306ab46909e17a94689237c05ebcb86266708f4a033f2be09
    74: 02cf604599664a5fb5853d144b3488ff8df4953bf66f63b1aa8bf948ad07528a
    120: ce5b10ab3756b36db3a037c8c412e5835e4095cd1059ddf02ea4a3c2add776bc
    174: 1311e14e3576ced84f2760043afc85194eabdd2db55d2c59b957299eb65075a6
    940: 0cc61502739d626dc42149e72639e49367726f7dd703d0eef0cbbe20ab4b34d9
  provenance: the run refuses to start if any book's text hash differs from text_sha256
  freshness: >
    Tokens 60,000 to 68,191 of each book. No earlier experiment used them: C1 to C3 used tokens 0 to 32,767 of these
    books, and C5 trained on tokens 40,960 to 47,103 of books 1260, 345, 37106 and 174. Those four books are
    reported separately (secondary). Shortest book: 94,774 tokens (Treasure Island).

adapter:
  file: results/raw/c5v1-20261029T025343Z/adapter.pt
  sha256: FILL_AT_SEAL              # from the pre-seal smoke run; must equal results/raw/c5v1-20261029T025343Z/training.json adapter_sha256
  family: all
  layers: [2, 3, 4, 5]
  rank: 8
  alpha: 16.0
  trained_on_regions:
    - {gutenberg_id: 1260, start: 40960}
    - {gutenberg_id: 345, start: 40960}
    - {gutenberg_id: 37106, start: 40960}
    - {gutenberg_id: 174, start: 40960}
  use: frozen; loaded into Glimmer as in C5 (y = W x + scale (alpha / r) B A x, branch skipped at scale 0); no training

conditions:
  scales: {S0: 0.0, S0.5: 0.5, S1: 1.0, S1.5: 1.5, S2: 2.0}
  order: S0, S0.5, S1, S1.5, S2; per scale, all clean inputs, then all switch pairs, then all noise inputs
  setup_checks: >
    On the first 2,048 tokens of book 1260: layer 10's o_proj input at scale 0 equals the unadapted model's bit for
    bit, scale 1 changes it, and returning to 0 reproduces it; at scale 0, C6's logits match the full model's within
    0.5 percent of the largest absolute logit. If a check fails, checks.json is written and C6 is not run, outcome U.

switch:
  start: 60000
  context: 6144
  after: 2048
  noise_tokens: 32
  noise_seed: 7
  inputs: >
    Clean: each book's tokens [60,000, 68,192). Switch, for each of the 90 ordered pairs (x, y) of different books:
    x's first 6,144 of those tokens, then y's last 2,048. Noise (secondary): y's clean input with its 32 tokens after
    position 6,144 replaced by tokens drawn from y's own first 6,144 (default_rng(7)).
  measure: >
    Next-token loss (natural log) on y's 2,048 tokens after the seam, with Glimmer's output path (head,
    output_multiplier, softcap; as C4 and C5), in float32 from bfloat16 logits. Excess per pair = the summed loss in
    the switch input minus the same tokens in y's clean input, at the same scale.

pass_criteria:
  excess_per_scale: mean over the 90 pairs of the summed excess (nats)
  outcome_U: an excess undefined or not finite, or excess(S0) not positive
  monotone: Spearman(scale, excess) over the 5 scales is at least 0.9
  effect: excess(S2) / excess(S0) - 1 is at least 0.05
  consistency: >
    For each of the 10 target books y, the mean excess over the 9 pairs that switch into y; at least 8 of the 10 have
    a higher value at S2 than at S0 (an undefined value counts as not agreeing)
  outcome_B1_confirmed: monotone, the effect and consistency
  outcome_B0_not_confirmed: every value defined and B1 does not hold; a fall is B0, reported with its direction
  secondary: >
    Reported, never gated: the rise for target books the adapter trained on (other regions) and for the 6 it never
    saw; excess by bin after the seam (1-16, 17-64, 65-256, 257-1,024, 1,025-2,048); noise excess per scale and its
    Spearman trend; clean mean loss per scale and the implied perplexity ratio to S0.

uncertainty:
  bootstrap: resample the 10 target books with replacement 1,000 times (numpy default_rng([0, 0])); report the 95 percent percentile interval of the relative rise at S2
  not_covered: one adapter from one training seed; the bootstrap covers target books only

decisions:
  B1: the topic-switch effect is confirmed on new text; the demo shows the dial as a control on how long Glimmer stays on old context, with its perplexity cost
  B0: not confirmed; C5's behavior result stays exploratory and is reported as such
  U: inconclusive; reported as is
  no_rescue: other text, books, scales, context lengths, bins or analysis code cannot be used to rescue a result
  restarts: >
    One complete run per sealed version, one runner at a time (a lock file in results/ledger/). A run writes
    STARTED.json first. A new run is refused if any run under the seal is complete, and otherwise needs a written
    infrastructure reason; all runs are kept and reported. The analysis refuses an incomplete run (no switch.json),
    a seal, code or adapter mismatch, or failed setup checks.

budget:
  max_gpu_hours: 1.5
  ledger: results/ledger/c6v1_<first 12 of seal hash>.jsonl, append-only
  seconds_per_forward_estimate: 2.5
  estimate: per scale 10 clean, 90 switch and 10 noise forwards of 8,192 tokens = 110; 550 forwards at about 2 s is about 0.31 hours, plus the load and checks, about 0.4 hours
  pre_seal_smoke: SMOKE_RESULT

analysis:
  runner: src/dialedin/run_c6.py
  code_sha256:
    src/dialedin/metrics.py: be148ff5096cbd9493996053c0101e21c35a74ae827ea6b6c6b26392afd2a113
    src/dialedin/glimmer.py: b64d1e60470f7f654b3137e65b5e4d554d3b82dde5fb30b755acbddd4cfff74c
    src/dialedin/pilot_c5.py: 673d18eeda98c3c7316fb92f6cc942d119bf20eff6db1262ff0a5bf9393ad38d
    src/dialedin/metrics_c6.py: dd6e2cc8394b87bb4fb3e2274aae2bbc56f8be6239c95286a94c7e3e6987fb2e
    src/dialedin/run_c6.py: 40d3b4bb55135ce2719bfe70017729cdc0916bd1d40a3bff6f6028694e7142b4
    src/dialedin/analyze_c6.py: 3356ab8b2c806b040b152ffa2fa410de103edda373570826b0cc063c1e025b1d
outputs:
  raw: results/raw/<run_id>/ (STARTED.json; switch.json with, per scale, clean mean loss per book, summed excess per pair, mean excess curves for switch and noise, setup checks, and a record of seal, code, platform, adapter and text hashes; any checks.json or FAILED record)
  derived: results/derived/<run_id>/c6_summary.json, citing every raw file used
