outputs:
  raw: results/raw/<run_id>/ (STARTED.json; phaseA.json; one book_<set>_<id>.json per book with, per condition and period, per-head target magnitude and noise floor for the measured layers, noise-bin power summed over heads, realized and nominal input component and realized-drive statistics; sham counts per condition; a record of seal, code, platform, selected and control heads, text and token hashes; any ATTEMPT and FAILED records). Every file is written atomically and never overwritten.
  derived: results/derived/<run_id>/c3_summary.json and c3_curves.png, citing every raw file used
