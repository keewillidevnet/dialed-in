outputs:
  raw: results/raw/<run_id>/ (STARTED.json; phaseA.json with the window, RoPE and perplexity-path checks; one book_<set>_<id>.json per book with, per condition and period, per-head target magnitude and noise floor, noise-bin power summed over heads, realized and nominal input component and realized-drive statistics; per condition the amplitude reference, perplexity, token-id hash and sham count; a record of seal, code, platform and text hashes; any ATTEMPT and FAILED records). Every file is written atomically and never overwritten.
  derived: results/derived/<run_id>/c4_summary.json and c4_curves.png, citing every raw file used
