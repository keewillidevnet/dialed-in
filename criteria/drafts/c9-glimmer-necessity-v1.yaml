# C9: is layer 2's v_proj necessary inside the dial? v1 (confirmatory)
# DRAFT. Proposed by Muse Wonder (muse-wonder-1.0 on the Meta Model API) in one turn of the lab loop, critiqued there
# by Muse Spark and revised by Wonder, then revised in review before sealing.
#   Turn record: results/agent/turn-20261030T005705Z.json. Proposal: results/agent/proposal-20261030T005422Z-muse-wonder-1.0.json;
#   Spark's critique: results/agent/critique-20261030T005457Z-muse-spark-1.3.md (verdict FIXABLE, four points);
#   Wonder's revision: results/agent/proposal-20261030T005705Z-muse-wonder-1.0-revised.json (prompts and replies in
#   results/agent/calls.jsonl).
#   Its question: C8 showed layer 2's v_proj is enough alone for a majority of the dial's tilt change; is it also
#   necessary, so that the full dial without it loses a large part of the change, while the full dial without a
#   matched module does not? Kept from the revision: the conditions BASE, FULL, V2, and the full dial without layer
#   2's v or layer 4's v (its third, without layer 2's o, is replaced: revision 7); the two read windows (layers 2 to 51, and layers 5 to 51, which both
#   layer 2's and layer 4's modules can reach); the pairing of each control with its window (Spark's point 1); set A,
#   tokens 32,768 to 65,535 (Spark's point 2); the replication gates on V2 alone (Spark's point 3); every bar
#   (0.60 and 0.80 main, 0.70 and 0.80 downstream, 4 of 5 books, the 15 percent floor) and the 2.0-hour order of cost.
# Revisions to the revised proposal (each with its reason):
#   1. Shares are set-level, from the set-mean curve, as in C7 and C8; the proposal's mean of per-book shares is
#      reported as a secondary. A single book's tilt is noisier than the set's, and a ratio of two noisy differences
#      per book is unstable.
#   2. The downstream window is judged only when the full dial flattens it by at least 2.5 percent; otherwise the
#      outcome says so (N1L at most). In C8 the full dial flattened layers 5 to 51 by only 4.6 percent on set C
#      (results/derived/c8v1-20261029T222946Z/c8_summary.json, diagnostic_groups.layers5_51), so a share there divides
#      by a small difference. The 2.5 percent floor is about half of that, chosen here for this reason.
#   3. The per-book rule applies to the main window only, for the same reason; downstream per-book values are reported.
#   4. The books are listed by id (Spark's point 4; the fact sheet held no ids, so Wonder named the set instead).
#   5. Outcome codes and their meanings are written out (N1, N1L, N0, R0, U), and what each control can and cannot show.
#   6. Expected values are stated next to every bar (predictions, below), from C8 and the deep probe. Every prediction
#      passes every bar: a pass is expected, and the test mainly guards against a large surprise on new text.
#   7. The same-layer control drops layer 2's output gate (gate_proj), not its o_proj. The heads are read at o_proj's
#      input, and an adapter on o_proj changes only o_proj's output, so dropping it leaves layer 2's own heads exactly as
#      under FULL; in C8 those heads carried a large part of the main change (layer 2's heads -74.1 percent, layers 3 to
#      51 -13.1, all -26.4). That control would pass by where the heads are read. The gate acts before the read point,
#      so it reaches layer 2's heads as v does. Found by the independent review of this draft.
#   8. All 15 text hashes are sealed, as in C5 and C8 (the loader requires 15); only set A is measured.
# Reviewed before sealing by two reviewers working separately: an independent reviewer (revisions 7 and 8, the honest
# statement of expected passes in revision 6, the NOV4 noise note, the C5 pilot disclosure, a stale docstring, and each
# window resampled on its own), and Muse Wonder (results/agent/review-20261030T014157Z-muse-wonder-1.0.md: the question
# now states each window's gate and the per-book flattening rule as the code applies them; a run with no book file is
# refused; the partial directory is named as the code names it; a stopped setup record lists earlier failures; its
# first point, the smoke placeholder, is filled after the pod smoke run).
# Follows C8 (sealed; run c8v1-20261029T222946Z: outcome O1; layer 2's v_proj alone gave 0.573 of the full dial's change
# on set C, 95 percent 0.562 to 0.582; layer 4's v_proj 0.004). Every value is a proposal until Keenan seals this file.

id: c9-glimmer-necessity-v1
version: 1
drafted: 2026-10-30
follows: c8-glimmer-one-matrix-dial-v1 (sealed, run complete, outcome O1)
proposed_by: muse-wonder-1.0 (results/agent/proposal-20261030T005705Z-muse-wonder-1.0-revised.json, after Muse Spark's critique), revised in review
status: draft

questions:
  necessity: >
    At scale 2, on set A tokens 32,768 to 65,535, does the full C5 dial without layer 2's v_proj keep at most 60
    percent of the full dial's set-level tilt change over layers 2 to 51, while the full dial without layer 2's output
    gate, gate_proj (same layer), keeps at least 80 percent, with at least 4 of 5 books in which FULL flattens the
    tilt and the dial keeps less without layer 2's v than without layer 2's gate? This main question is judged only
    if C8's sufficiency result replicates here (V2 alone keeps 0.40 to 1.40 of the change over layers 2 to 51).
    Separately, over layers 5 to 51: does the dial without layer 2's v keep at most 70 percent while the dial without
    layer 4's v (same module type) keeps at least 80 percent? This downstream question is judged only if FULL flattens
    layers 5 to 51 by at least 2.5 percent and V2 alone keeps 0.20 to 1.40 there; if not, the outcome is at most N1L.
  predictions: >
    FULL flattens the main tilt by about a quarter (C5 -24.0, C7 -26.8, C8 -26.4 percent) and layers 5 to 51 by about
    5 percent (C8 -4.6). V2 alone keeps about 0.57 (C8). Without layer 2's v, the dial keeps between about 0.43 (if
    v's contribution were entirely its own: 1 - 0.573) and about 0.58 (if v's own part is what it adds on top of q and
    k: 1 - (0.775 - 0.359), C8's QKV2 and QK2 shares, which overlap by about 20 percent). The deep probe points the
    same way: layer 2's attention kept 0.837 of the full dial's change with all five of its modules and 0.386 without
    v, so dropping v cost about 0.45, which would leave about 0.55 here (exploratory: set C, 8,192 tokens, minimum
    whole-model SNR 2.2, below this file's bar of 3). Every estimate is below the 0.60 bar, so a pass is expected; the
    informative number is how much is lost, read from retained(NOV2) and its interval. Without layer 2's gate it keeps
    about all of the change (the deep probe: dropping the gate from layer 2 attention kept 0.833 of the full dial's
    change against 0.837 with it, results/raw/probe-loc-deep-20261029T075459Z/localize.json). Downstream, without layer 2's v it keeps about 0.52
    (1 - C8's 0.478 over layers 5 to 51) and without layer 4's v about 0.94 (1 - 0.061). These pass too. Perplexity stays within 1.5
    percent of BASE.

