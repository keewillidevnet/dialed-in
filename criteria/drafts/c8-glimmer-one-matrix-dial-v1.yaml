outputs:
  raw: results/raw/<run_id>/ (STARTED.json; phaseA.json with the adapter, condition and perplexity-path checks; one book_C_<id>.json per book with, per condition and period, per-head target magnitude and noise floor, noise-bin power summed over heads, realized and nominal input component and realized-drive statistics; per condition the amplitude reference, perplexity and sham count; a record of seal, code, platform, adapter, condition modules and text hashes; any ATTEMPT and FAILED records). Every file is written atomically and never overwritten.
