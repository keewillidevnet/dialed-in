# C2: does the knob tune Glimmer's frequency response? v1
# DRAFT. Follows the sealed C1 v5 (criteria/sealed/c1-glimmer-frequency-response-v5.yaml, sha256
# 44810da4c9148c1c0065241a834d51d43eaca3a444e6214379347851f7d2f97b), whose run
# c1v5-20261027T152040Z gave outcome T with a low-pass tilt: gain rose with the drive period N at
# every step on all three sets (Spearman rho 1.000), with all 23 periods valid.
# C2 asks whether that tilt can be dialed: scaling the global layers' attention contribution should
# change it, and the same scaling on local layers should change it much less.
# Drive, window, operator, noise bins, validity and run rules are C1 v5's, unchanged.
# Every value is a proposal until Keenan seals this file with scripts/seal.sh.

id: c2-glimmer-knob-tilt-v1
version: 1
drafted: 2026-10-27
follows: c1-glimmer-frequency-response-v5 (sealed, run complete, outcome T low-pass)
status: draft

questions:
  C2: Does scaling the 13 global layers' attention output change the tilt of Glimmer's frequency response, more than the same scaling on 13 local layers does?
  prediction: Turning the global knob up steepens the low-pass tilt (direction "+"). The global layers are the only ones that attend over the whole context without a position limit, so they should carry the slow, long-range part of the response.

platform:
  model: meta-models/Muse-Glimmer-30B
  revision: cec94fcfd651            # full hash in /workspace/weights/DOWNLOAD_LOG.txt
  loader: AutoModelForMultimodalLM
  precision: bfloat16               # no quantization_config
  attention: sdpa
  transformers: "5.21.0"
  torch: "2.8.0+cu128"
  gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
  batch_size: 1                     # every pass, so undriven and driven runs use identical kernels
  deterministic: torch.use_deterministic_algorithms(True, warn_only=False) so any op without a deterministic implementation stops the run; CUBLAS_WORKSPACE_CONFIG=:4096:8, TF32 off, fixed seeds
  allocator: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  preflight_must_pass: [dtype_bf16, no_quantization, sdpa, batch_size_1, revision_match, versions_match, gpu_match, layer_layout, seal_hash_match, code_hash_match, text_hash_match, budget_projection]

inputs:
  length_tokens: 32768
  start: first token of the main text, after the Project Gutenberg header is stripped
  special_tokens: none (no BOS); input = first 32,768 token ids of the stripped text
  prompt_sets:                      # 3 independent sets, 5 public-domain books each, no author shared across sets
    # Project Gutenberg ebook IDs. Text = body between the *** START and *** END markers.
    A: {1342: Pride and Prejudice, 2701: Moby Dick, 1400: Great Expectations, 145: Middlemarch, 1184: The Count of Monte Cristo}
    B: {1260: Jane Eyre, 768: Wuthering Heights, 345: Dracula, 84: Frankenstein, 25344: The Scarlet Letter}
    C: {37106: Little Women, 74: The Adventures of Tom Sawyer, 120: Treasure Island, 174: The Picture of Dorian Gray, 940: The Last of the Mohicans}
  token_counts_checked: 2026-10-26, shortest 94,774 tokens (Treasure Island), all at least 33,792
  text_manifest: /workspace/data/books/MANIFEST.json
  text_sha256:                      # gutenberg_id -> sha256 of the stripped text, from the manifest
    1342: cb7c0d9af2041d31e655fafe79becb0877c3fc775690c7a558eb8707035e5138
    2701: 6b74a36cf4b629ac137c8832b2ba2be071a02c348f3accde0c026a893a2f30eb
    1400: c6196113039a054e075999518fd4f081838335b58cc0371f04b99080de03e7fe
    145: 9d0ce5c0b701c05b38198f6fab45b8ebf2eb3645a81aa55794ccd0aa66cdaf0d
    1184: ea17c0e73310be451ea977324ff72be950aa63ae76b95eac946386cfb8f97045
    1260: 67453a6d7b7ebe4c3f4525bea71e5564ca1562eb4c62c01e8e086d65370627e1
    768: d23b4feab29dcfa7411bbb8041e825dd48e3e1c1721c61c392ccfb46968fd6fd
    345: f20fc68a26f548cbc0c7ea33129b0d65dffb6cbd9f5d382fde64837dea445fc3
    84: 3839fa35c116713f811903545470041a86079268307ae9fd3ed4d04c88788bc0
    25344: 47e262c46b86b85f8cb5f830366396dc47f9c4e0a2ab7625390231afa290111a
    37106: c0e400eaac9e8e3306ab46909e17a94689237c05ebcb86266708f4a033f2be09
    74: 02cf604599664a5fb5853d144b3488ff8df4953bf66f63b1aa8bf948ad07528a
    120: ce5b10ab3756b36db3a037c8c412e5835e4095cd1059ddf02ea4a3c2add776bc
    174: 1311e14e3576ced84f2760043afc85194eabdd2db55d2c59b957299eb65075a6
    940: 0cc61502739d626dc42149e72639e49367726f7dd703d0eef0cbbe20ab4b34d9
  provenance: the run refuses to start if any book's text hash differs from text_sha256
  reuse: C2 deliberately uses the same 15 books and the same first 32,768 tokens as C1 v5, so condition G1.0 repeats C1 v5's main drive at C2's periods and the knob effect is read against it
  reserved_for_C3: chosen in the C3 file

knob:
  point: the output of post_attention_layernorm, multiplied by g, right before the residual add (h = h + g * post_attention_layernorm(self_attn(input_layernorm(h)))); at g = 1 the hook returns nothing and the model is unchanged bit for bit
  global_layers: [3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51]   # every global layer
  local_layers: [2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50]    # 13 local layers, one per block, matched in count
  conditions: [G1.0, G0.5, G1.5, L0.5, L1.5]                          # G = global knob at g, L = local knob at g; exactly one knob differs from 1
  order_per_book: conditions in the order listed; each gets its own undriven pass and sham
  note: the knob acts after layer 1, so the drive and its amplitude reference at the layer 1 output are the same under every condition; the runner checks this and stops if the reference changes

drive:
  injection_point: residual stream output of decoder layer 1
  measured_layers: 2 to 51 (37 local, 13 global)
  direction: one unit vector in the 6,656-dim residual space, torch.randn on CPU with torch.Generator seeded 0, float32, divided by its norm
  waveform: at every token t = 0 .. 32767, add A * cos(2 pi t / N) * direction, A = a times the amplitude reference, phase 0 (C1 v5's main drive)
  add: computed in float32, cast once to bfloat16; zero products keep the stored value; the realized drive along the direction is used for the input component (src/dialedin/wave.py, sealed with C1 v5)
  amplitude: a = 0.1, the value C1 v5's sealed Phase A chose; amplitude reference = median per-token residual norm at the layer 1 output from the book's own undriven pass
  periods_N: [2, 4, 16, 64, 256, 1024, 4096]   # 7 periods spanning C1 v5's grid; all divide the window
  phase_A: >
    On book 1342, under each of the 5 conditions: one undriven pass, then A and 2A at N = 2 and
    4096 (one sham before the first condition). A condition passes if the 2A/A response ratio
    (whole-model mean target magnitude) is within 10 percent of 2 at both N and the whole-model
    SNR at A, N = 4096 is at least 3. If any condition fails, stop: C2 is not run, outcome U.
    Phase A never enters the C2 tilts.
  controls:
    sham: zero wave, under every condition of every book, plus a closing sham per book; every head-output value must have the same bits as that condition's undriven pass (int16 view), or the run stops and the book is not written
    local_knob: conditions L0.5 and L1.5 test whether any knob of the same strength changes the tilt; the claim is specificity to the global layers
    reproduction: condition G1.0 runs the same computation as C1 v5 at the shared periods; the maximum relative difference of per-head target magnitudes from C1 v5's raw files is reported, not a gate

measurement:
  read_point: forward pre-hook on self_attn.o_proj (gated head outputs, 32 heads x 128)
  response: driven minus undriven head output, per head, per token, computed in float32
  window: >
    One window for every N: tokens [8192, 32768), W = 24576. Every period N divides W,
    so the target bin k0 = W / N is a whole number (smallest k0 = 6 at N = 4096). The
    first 8192 tokens are a burn-in, four times the sliding window.
  operator: >
    Per head dimension: remove the least-squares line a + b t over the window, multiply by
    a periodic Hann window, and take the Fourier sum at each analysis frequency. The same
    operator is applied to the input drive, so a pass-through head has gain 1 (tested to 1e-5 in float32).
    Line removal biases gain by under 0.1 percent on this grid (tested).
  target_component: per head, the norm over its 128 dims of the operator output at frequency 1/N
  input_component: the operator output at 1/N for the realized drive along the direction (what bfloat16 actually stored); the nominal component of w_t is recorded beside it
  gain: target_component divided by input_component
  noise_bins: >
    Integer bins k in (0, W / 2], excluding every bin within 1 of a multiple of k0 (DC
    included): the up to 8 nearest below k0 and the 8 nearest above. At N = 4096 only 3 lie
    below (k = 2, 3, 4); at least 3 are required. At N = 2 the target is
    the Nyquist bin, so the 16 nearest below are used. Hann leakage from any harmonic reaches
    only its two neighbor bins, which are excluded.
  floor_rule: >
    Two-sided floor = the larger of the median over the bins below k0 and the median over
    the bins above k0 (at N = 2, the median of all 16). Smooth drift leaks mostly into low
    bins, so a floor taken only above k0 would let drift pass as signal at long N (tested
    with log, inverse, square, square-root and exponential drifts: all stay below SNR 1).
  noise_floor_per_head: two-sided floor of the head's noise-bin magnitudes (diagnostics only)
  snr: >
    Whole-model SNR per book and N: sqrt(sum over all 1,600 measured heads of target power,
    divided by the two-sided floor of the noise-bin power summed over all heads).
  validity: >
    Per condition, a period counts for a set only if the median over the set's five books of
    the whole-model SNR is at least 3. Invalid periods are excluded from that set's tilt for
    that condition and listed in the output.
  curves:
    per_book: mean gain over all heads in layers 2 to 51 (whole), over local-layer heads (local), and over global-layer heads (global), per N
    per_set: the mean over its five books of each book's curve, per N
    per_condition: every curve is computed separately for each knob condition

tilt:
  definition: per set and condition, the least-squares slope of ln(set-mean whole-model gain) against ln(N) over the periods valid under all five conditions in that set (so a period lost under one condition cannot shift another condition's slope through curvature); needs at least 5 of the 7 periods and positive gains, otherwise undefined
  meaning: the exponent of a power-law fit; positive means gain rises with N (low-pass tilt)

pass_criteria:
  C2:
    order: U is checked first, then K1, K2, K0
    outcome_U_inconclusive: any tilt undefined in any set and condition, or Phase A stopped C2
    direction: >
      "+" if on every set tilt(G0.5) < tilt(G1.0) < tilt(G1.5); "-" if on every set
      tilt(G0.5) > tilt(G1.0) > tilt(G1.5); otherwise no direction.
    effect: on every set |tilt(G1.5) - tilt(G0.5)| is at least 0.25 x |tilt(G1.0)|
    specificity: on every set |tilt(G1.5) - tilt(G0.5)| is at least 2 x |tilt(L1.5) - tilt(L0.5)|
    outcome_K1_tunable_and_global_specific: a direction, the effect and specificity
    outcome_K2_tunable_not_specific: a direction and the effect, but not specificity
    outcome_K0_not_tunable: every tilt defined and K1 and K2 do not hold
    prediction_held: reported for K1 and K2, true if the direction is "+"
  incomplete_run: if any of the 15 books lacks a valid record, there is no outcome; a partial look is labeled PARTIAL and never reported as C2

uncertainty:
  bootstrap: >
    Within each set, resample its five books with replacement 1,000 times (numpy
    default_rng([0, i]) for the i-th set in sorted order); for each resample recompute
    validity, the set curves and the tilts. Report 95 percent percentile intervals of
    tilt(G1.5) - tilt(G0.5) and of tilt(L1.5) - tilt(L0.5). Five books allow only 126
    distinct resamples, so intervals are coarse.

diagnostics_not_gates:
  book_tilts: each book's tilt per condition, from its own curve and its own SNR >= 3 validity
  book_signs: of the books with every tilt defined, how many have tilt(G1.5) > tilt(G0.5), and the same for the local knob
  group_tilts: tilts of the local-head and global-head mean curves per set and condition
  reproduction: G1.0 against C1 v5 raw files, maximum relative difference of per-head target magnitudes; expected to be exactly 0 (same code path, deterministic), reported as "not found" if the C1 v5 raw files are missing
  knob_size: median per-token norm of post_attention_layernorm output in each knob layer, from each book's G1.0 undriven pass, averaged over the global and over the local knob layers; tells whether a K1 could reflect the global layers simply contributing more, which the outcome rules do not separate

decisions:
  K1: the knob claim stands and is specific to the global layers; it is the demo's center
  K2: the knob tunes the tilt, but so does a local knob of the same strength; the demo shows tuning and says it is not specific to global layers
  K0: the knob does not tune the tilt; the demo shows the measured C1 curve and drops the tuning claim
  U: inconclusive; reported as is; any follow-up is a new sealed version
  no_rescue: other knob values, other layers, other periods, other amplitudes or other analysis code cannot be used to rescue a result
  restarts: >
    One complete run per sealed version, and one runner process at a time (a lock file in
    results/ledger/). Each run writes STARTED.json before any GPU work. A new run is
    refused if any earlier run under the seal is complete or was stopped by rule in Phase A
    (not linear or underpowered under some condition), and otherwise needs a written reason (an
    infrastructure failure: crash, failed sham, preflight failure). Only the newest run
    may continue to Phase B, and Phase B needs that run's STARTED.json. Every book attempt
    writes an ATTEMPT record first; a book with an earlier attempt or failure record may be
    retried only with a written reason, stamped on that book. All earlier runs and records
    are kept and listed in the summary. The analysis refuses to run if more than one run
    under the seal is complete, requires phaseA.json, and never overwrites a summary.

budget:
  max_gpu_hours: 4                  # wall-clock hours of every run process under this seal, from start to exit, including model loads
  ledger: results/ledger/c2v1_<first 12 of seal hash>.jsonl, append-only, one line per step; outside results/raw/
  seconds_per_pass_estimate: 14     # used only for the Phase A preflight; Phase B uses the measured pass time
  preflight: each phase refuses to start if hours used plus its projected need exceed the cap; every pass also checks the cap first
  estimate: Phase A 26 passes (1 sham, then per condition 1 undriven and 4 driven); Phase B 15 books x 46 passes (per condition 1 undriven, 1 sham and 7 driven, plus 1 closing sham) = 690 passes; 716 passes at about 13.4 s is about 2.67 hours plus about 0.05 for loads
  cost: about $7 at about $2.50 per pod hour for counted time; pod time between processes is billed separately
  peak_gpu_memory: same as C1 v5 (74.3 GiB measured); the knob hook adds no stored tensors
  pre_seal_smoke: measured 2026-10-27 with src/dialedin/smoke_c2.py at commit 8872531, real C2 Session, book 1342, conditions G1.0, G0.5, G1.5 and L0.5; 13.09 to 13.52 s per pass, peak 74.3 GiB, every sham and the closing sham 0 differing values, amplitude reference unchanged by the knob, outputs finite, knob-size probe ran on 26 layers; 716 passes at 13.4 s is about 2.67 hours plus about 0.05 for loads

