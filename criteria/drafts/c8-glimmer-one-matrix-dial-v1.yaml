# C8: is the dial one matrix? v1 (confirmatory)
# DRAFT. Proposed by Muse Wonder (muse-wonder-1.0 on the Meta Model API), revised in review before sealing.
#   Proposal: results/agent/proposal-20261029T193320Z-muse-wonder-1.0.json (prompt and reply in results/agent/calls.jsonl).
#   Its question: does layer 2's v_proj alone, at scale 2, keep most of the full dial's tilt flattening at 32,768 tokens,
#   while the same module in another layer does not? Its six conditions, 15 percent floor on the full effect, 4-of-5
#   book rule and 0.30 cap on the control are kept.
# Revisions in review (each with its reason):
#   1. Share bar 0.50, not 0.60. The proposal cited v alone at 0.6378 [probe-loc-deep] as if it were a share of the full
#      dial; it is a share of layer 2 attention's change, which was 0.8373 of the full dial [probe-loc], so v alone was
#      about 0.53 of the full dial (8,192 tokens, set C, exploratory). 0.50 asks for a majority of the full effect from
#      1 of 32 matrices; it was chosen after seeing that implied value, which sits near the bar.
#   2. Control layer 4's v_proj, not layer 3's. Layer 3 is a global layer (no position encoding, full attention);
#      layer 2 and layer 4 are both local layers with the same 2,048-token window and both carry the adapter.
#   3. Text: set C, first 32,768 tokens, not tokens after 70,000. Book 120 has 94,774 tokens, too short for a
#      32,768-token segment after 70,000 (a risk the proposal named). No adapter condition has been measured on set C's
#      first 32,768 tokens; BASE reproduces C1 v5 there.
#   4. Shares are set-level (as C7), from tilts fit over the periods valid under every condition; the proposal's per-book
#      mean is reported as a secondary. The per-book rule uses C7's 0.30 book share, not 0.50: one book's tilt is noisier
#      than the set's, and the set-level bar carries the claim.
# Follows C7 (sealed; run c7v1-20261029T154201Z: outcome M1; layer 2 q, k, v alone gave 0.797 of the full dial's
# change on set B). Every value is a proposal until Keenan seals this file.

id: c8-glimmer-one-matrix-dial-v1
version: 1
drafted: 2026-10-29
follows: c7-glimmer-dial-localization-v1 (sealed, run complete, outcome M1)
proposed_by: muse-wonder-1.0 (results/agent/proposal-20261029T193320Z-muse-wonder-1.0.json), revised in review
status: draft

questions:
  one_matrix: >
    At scale 2 on set C, does turning on only layer 2's v_proj (1 of the C5 adapter's 32 modules) give between 50 and
    140 percent of the tilt change that all 32 give, in at least 4 of 5 books, while the same module in layer 4 moves
    it by at most 30 percent of that change in either direction?
  predictions: >
    FULL flattens the tilt by about a quarter, as on sets A and B (C5 -24.0, C7 -26.8 percent). QKV2 repeats C7, near
    80 percent. V2 gives somewhat more than half (the probes imply about 53 percent at 8,192 tokens); QK2 gives
    less (about 37 percent implied); V2 plus QK2 is close to QKV2. V4 gives little. Perplexity stays within 1 percent.

platform:
  model: meta-models/Muse-Glimmer-30B
  revision: cec94fcfd651            # full hash in /workspace/weights/DOWNLOAD_LOG.txt
  loader: AutoModelForMultimodalLM
  precision: bfloat16               # no quantization_config
  attention: sdpa
  transformers: "5.21.0"
  torch: "2.8.0+cu128"
  gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
  batch_size: 1                     # every pass, so undriven and driven runs use identical kernels
  deterministic: torch.use_deterministic_algorithms(True, warn_only=False) so any op without a deterministic implementation stops the run; CUBLAS_WORKSPACE_CONFIG=:4096:8, TF32 off, fixed seeds
  allocator: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  preflight_must_pass: [dtype_bf16, no_quantization, sdpa, batch_size_1, revision_match, versions_match, gpu_match, layer_layout, seal_hash_match, code_hash_match, text_hash_match, budget_projection]

inputs:
  length_tokens: 32768
  start: first token of the main text, after the Project Gutenberg header is stripped
  special_tokens: none (no BOS); input = first 32,768 token ids of the stripped text
  prompt_sets:
    C: {37106: Little Women, 74: The Adventures of Tom Sawyer, 120: Treasure Island, 174: The Picture of Dorian Gray, 940: The Last of the Mohicans}
  why_set_C: >
    No adapter condition has been measured on set C's first 32,768 tokens. The adapter trained on books 37106 and 174
    at tokens 40,960 to 47,103 only; the exploratory probes used set C at tokens 60,000 to 68,191; C6 used set C at
    tokens 60,000 to 68,191 (losses only). C1 v5 measured set C's first 32,768 tokens on the base model, which BASE
    reproduces.
  token_counts_checked: 2026-10-26 for all 15 books (C5 spec), shortest 94,774 tokens (book 120)
  text_manifest: /workspace/data/books/MANIFEST.json
  text_sha256:                      # gutenberg_id -> sha256 of the stripped text, from the manifest
    1342: cb7c0d9af2041d31e655fafe79becb0877c3fc775690c7a558eb8707035e5138
    2701: 6b74a36cf4b629ac137c8832b2ba2be071a02c348f3accde0c026a893a2f30eb
    1400: c6196113039a054e075999518fd4f081838335b58cc0371f04b99080de03e7fe
    145: 9d0ce5c0b701c05b38198f6fab45b8ebf2eb3645a81aa55794ccd0aa66cdaf0d
    1184: ea17c0e73310be451ea977324ff72be950aa63ae76b95eac946386cfb8f97045
    1260: 67453a6d7b7ebe4c3f4525bea71e5564ca1562eb4c62c01e8e086d65370627e1
    768: d23b4feab29dcfa7411bbb8041e825dd48e3e1c1721c61c392ccfb46968fd6fd
    345: f20fc68a26f548cbc0c7ea33129b0d65dffb6cbd9f5d382fde64837dea445fc3
    84: 3839fa35c116713f811903545470041a86079268307ae9fd3ed4d04c88788bc0
    25344: 47e262c46b86b85f8cb5f830366396dc47f9c4e0a2ab7625390231afa290111a
    37106: c0e400eaac9e8e3306ab46909e17a94689237c05ebcb86266708f4a033f2be09
    74: 02cf604599664a5fb5853d144b3488ff8df4953bf66f63b1aa8bf948ad07528a
    120: ce5b10ab3756b36db3a037c8c412e5835e4095cd1059ddf02ea4a3c2add776bc
    174: 1311e14e3576ced84f2760043afc85194eabdd2db55d2c59b957299eb65075a6
    940: 0cc61502739d626dc42149e72639e49367726f7dd703d0eef0cbbe20ab4b34d9
  provenance: the run refuses to start if any book's text hash differs from text_sha256

adapter:
  file: results/raw/c5v1-20261029T025343Z/adapter.pt
  sha256: 2b20e86e9af79b81dc881bbedbef350331a24ef8ee1d541183ba6bac035d9f20   # the C6 v2 sealed value; the runner refuses to start, before STARTED.json, unless the file, this value and results/raw/c5v1-20261029T025343Z/training.json adapter_sha256 all agree
  family: all
  layers: [2, 3, 4, 5]
  rank: 8
  alpha: 16.0
  frozen: no training; the adapter is loaded as C5 trained it

conditions:
  BASE: {scale: 0.0, modules: all}  # Glimmer itself; every module's branch is skipped at scale 0
  FULL: {scale: 2.0, modules: all}  # all 32 modules on
  QKV2:
    scale: 2.0
    modules: [layers.2.self_attn.q_proj, layers.2.self_attn.k_proj, layers.2.self_attn.v_proj]
  V2:
    scale: 2.0
    modules: [layers.2.self_attn.v_proj]
  QK2:
    scale: 2.0
    modules: [layers.2.self_attn.q_proj, layers.2.self_attn.k_proj]
  V4:
    scale: 2.0
    modules: [layers.4.self_attn.v_proj]
  switching: >
    A module is off when its B factor is set to zero; its branch then adds exactly zero. Switching a condition copies
    each on module's saved B back, so every condition sees the trained values bit for bit (checked). The scale is the
    shared C5 dial value. Every masked condition switches on a different set of modules (checked).
  order_per_book: BASE, FULL, QKV2, V2, QK2, V4; each gets its own undriven pass (with perplexity) and sham
  setup_checks: >
    At the start of Phase A, on the first 2,048 tokens of book 74, layer 10's o_proj input: BASE must equal the
    unadapted model's (recorded before the adapter is attached) bit for bit; every other condition must differ from
    BASE and from every other condition; FULL again after the masked conditions must equal the first FULL bit for bit,
    and BASE again the first BASE. Perplexity path: under BASE, the logits must match the full model's own logits to
    within 0.5 percent of the largest absolute logit. If a check fails, phaseA.json is written and C8 is not run,
    outcome U.
  perplexity: >
    On every undriven pass, exp of the mean next-token loss over predictions of tokens 8,193 to 32,767 (as C5). Per
    condition, the median over books of the ratio to BASE. Reported, not gated.

drive:
  injection_point: residual stream output of decoder layer 1
  measured_layers: 2 to 51 (37 local, 13 global)
  direction: one unit vector in the 6,656-dim residual space, torch.randn on CPU with torch.Generator seeded 0, float32, divided by its norm
  waveform: at every token t = 0 .. 32767, add A * cos(2 pi t / N) * direction, A = a times the amplitude reference, phase 0 (C1 v5's main drive)
  add: computed in float32, cast once to bfloat16; zero products keep the stored value; the realized drive along the direction is used for the input component (src/dialedin/wave.py, sealed with C1 v5)
  amplitude: a = 0.1, the value C1 v5's sealed Phase A chose; amplitude reference = median per-token residual norm at the layer 1 output from that condition's own undriven pass (the adapter sits in later layers, so this is the same under every condition, and is recorded)
  periods_N: [2, 4, 16, 64, 256, 1024, 4096]
  phase_A: >
    On book 74, after the setup checks, under every condition (BASE, FULL, QKV2, V2, QK2, V4): one undriven pass, then A
    and 2A at N = 2 and 4096 (one sham, after BASE's undriven pass, which it is compared against). A condition passes if the 2A/A response ratio is
    within 10 percent of 2 at both N and the whole-model SNR at A, N = 4096 is at least 3. If any fails, stop: C7 is
    not run, outcome U.
  controls:
    sham: zero wave, under every condition of every book, plus a closing sham per book; every head-output value must have the same bits as that condition's undriven pass (int16 view), or the run stops and the book is not written
    reproduction: BASE runs the same computation as C1 v5's main drive on set C (same tokens, direction, amplitude rule and periods); the maximum relative difference of per-head target magnitudes from C1 v5's raw files (run c1v5-20261027T152040Z) is reported, expected 0, not a gate

measurement:
  read_point: forward pre-hook on self_attn.o_proj (gated head outputs, 32 heads x 128), layers 2 to 51 as in C1 v5
  response: driven minus undriven head output, per head, per token, computed in float32
  window: >
    One window for every N: tokens [8192, 32768), W = 24576. Every period N divides W,
    so the target bin k0 = W / N is a whole number (smallest k0 = 6 at N = 4096). The
    first 8192 tokens are a burn-in, four times the sliding window.
  operator: >
    Per head dimension: remove the least-squares line a + b t over the window, multiply by
    a periodic Hann window, and take the Fourier sum at each analysis frequency. The same
    operator is applied to the input drive, so a pass-through head has gain 1 (tested to 1e-5 in float32).
    Line removal biases gain by under 0.1 percent on this grid (tested).
  target_component: per head, the norm over its 128 dims of the operator output at frequency 1/N
  input_component: the operator output at 1/N for the realized drive along the direction (what bfloat16 actually stored); the nominal component of w_t is recorded beside it
  gain: target_component divided by input_component
  noise_bins: >
    Integer bins k in (0, W / 2], excluding every bin within 1 of a multiple of k0 (DC
    included): the up to 8 nearest below k0 and the 8 nearest above. At N = 4096 only 3 lie
    below (k = 2, 3, 4); at least 3 are required. At N = 2 the target is
    the Nyquist bin, so the 16 nearest below are used. Hann leakage from any harmonic reaches
    only its two neighbor bins, which are excluded.
  floor_rule: >
    Two-sided floor = the larger of the median over the bins below k0 and the median over
    the bins above k0 (at N = 2, the median of all 16). Smooth drift leaks mostly into low
    bins, so a floor taken only above k0 would let drift pass as signal at long N (tested
    with log, inverse, square, square-root and exponential drifts: all stay below SNR 1).
  noise_floor_per_head: two-sided floor of the head's noise-bin magnitudes (diagnostics only)
  snr: >
    Whole-model SNR per book and N: sqrt(sum over all 1,600 measured heads of target power,
    divided by the two-sided floor of the noise-bin power summed over all heads).
  validity: >
    Per condition, a period counts for a set only if the median over the set's five books of
    the whole-model SNR is at least 3. Invalid periods are excluded from that set's tilt for
    that condition and listed in the output.
  curves:
    per_book: mean gain over all heads in layers 2 to 51 (whole), per N
    per_set: the mean over its five books of each book's curve, per N
    per_condition: every curve is computed separately for each condition

tilt:
  definition: the least-squares slope of ln(set-mean whole-model gain) against ln(N) (metrics_c2.tilt, sealed with C2), fit over the periods valid under every condition; a tilt needs at least 5 of the 7 periods valid, otherwise it is undefined
  book_tilts: each book's tilt per condition from its own curve, over the periods valid in that book under every condition (same 5-period minimum)

pass_criteria:
  share: for a condition X, (tilt(X) - tilt(BASE)) / (tilt(FULL) - tilt(BASE)), set-level tilts
  outcome_U: any of the six set-level tilts undefined, tilt(BASE) not positive, or (tilt(FULL) - tilt(BASE)) / tilt(BASE) above -0.15 (Muse Wonder's floor; shares are unstable when the full effect is small)
  book_agrees: a book agrees if its BASE, FULL and V2 tilts are defined, FULL and V2 both flatten it, and (tilt(V2) - tilt(BASE)) / (tilt(FULL) - tilt(BASE)) in that book is at least 0.30
  sufficient: share(V2) between 0.50 and 1.40 inclusive (above 1.40 one module overshoots the whole adapter, and it is not counted), and at least 4 of the 5 books agree
  specific: the absolute value of share(V4) at most 0.30 (the matched control may neither carry nor oppose more than 30 percent of FULL's change)
  outcome_V1_one_matrix_dial: sufficient and specific
  outcome_V2S_sufficient_not_specific: sufficient, not specific
  outcome_V0_not_one_matrix: every tilt defined, FULL flattens enough, and not sufficient (the reason is recorded)
  incomplete_run: if any of the 5 books lacks a valid record, there are no outcomes; a partial look is labeled PARTIAL, its numbers are kept under partial_diagnostic, and it is never reported as C8
  every_run_reported: every run under this seal is reported; a run that is never finished is reported as unfinished
  secondary: >
    Reported, never gated, pre-registered: FULL's relative tilt change (against C5's -24.0 and C7's -26.8 percent);
    share(QKV2) (a replication of C7 on another set); share(QK2); share(V2) / share(QKV2); (share(V2) + share(QK2)) /
    share(QKV2) (whether v and q, k add); per-book tilts and shares, and the mean of per-book V2 shares (Muse Wonder's
    proposed metric); median perplexity ratio per condition; set-level tilts, changes and shares over (a) layer 2's
    heads, (b) layers 3 to 51, (c) layers 6 to 51, fit over the main periods; the BASE reproduction of C1 v5 (targets,
    input component, amplitude reference; complete only if every book and period was compared).

uncertainty:
  bootstrap: >
    Resample the five books with replacement 1,000 times (numpy default_rng([0, 0])); for each resample recompute
    validity, curves and tilts. Report 95 percent percentile intervals of share(V2), share(V4), share(QKV2),
    share(QK2) and FULL's relative change. Shares are taken only from resamples where FULL flattens by at least 15
    percent; resamples with an undefined tilt or tilt(BASE) not positive are dropped; the number used is reported.
  not_covered: one adapter from one training seed; one probe direction; the bootstrap covers books only; the claim is about the trained C5 adapter's modules, not about v_proj in a model with no adapter

decisions:
  V1: one matrix of the dial carries a majority of its effect on the tilt, and the same matrix one local layer later does not; the dial's mechanism claim narrows to layer 2's v_proj
  V2S: layer 2's v_proj is enough for a majority, but the matched control also moves the tilt by more than 30 percent of FULL's change; reported as not layer-specific
  V0: one matrix does not carry a majority (or too few books agree, or it overshoots); the C7 claim about layer 2's q, k, v stands, the one-matrix claim does not; the reason is recorded
  U: inconclusive; reported as is
  no_rescue: other module sets, scales, layers, books, periods, amplitudes or analysis code cannot be used to rescue a result
  restarts: >
    One complete run per sealed version, and one runner process at a time (a lock file in results/ledger/). A new
    run writes STARTED.json before any GPU work and is refused if any earlier run under the seal is complete or was
    stopped by rule in Phase A; otherwise a new run needs a written reason (an infrastructure failure). A run is
    continued with --run-id; only the newest run may continue; a Phase A retry after a failure record, and every book
    with an earlier attempt or failure record, need a written reason, stamped on the record. All records are kept.
    Before admission (so a failure leaves no run): seal and code hashes, condition names and scales, no placeholder
    left in this file, the adapter hash against this file and C5's training.json, and every text hash. The model load
    and platform preflight run after STARTED.json; a failure there is an infrastructure failure. The analysis
    refuses to run if more than one run under the seal is complete, requires phaseA.json (not stopped, condition
    modules as sealed), and never overwrites a summary.

budget:
  max_gpu_hours: 2.0                # wall-clock hours of every run process under this seal, including model loads
  ledger: results/ledger/c8v1_<first 12 of seal hash>.jsonl, append-only, one line per step; outside results/raw/
  seconds_per_pass_estimate: 14     # used only for the Phase A preflight; Phase B uses the measured pass time
  estimate: >
    Phase A: 31 passes (per condition 1 undriven and 4 driven, plus 1 sham) and 11 short check passes at 2,048 tokens
    (1 reference, 8 adapter and condition, 2 logits). Phase B: 5 books x 55 passes (per condition 1 undriven, 1 sham
    and 7 driven, plus 1 closing sham) = 275. 306 passes at C7's measured 13.3 to 13.7 s is about 1.15 hours, plus
    perplexity on 36 undriven passes and the load, about 1.25 hours. Muse Wonder estimated 1.7 hours.
  peak_gpu_memory: about C7's 76.8 GiB
  pre_seal_smoke: SMOKE_RESULT

