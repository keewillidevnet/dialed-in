# C1 and C1b: Glimmer frequency response
# DRAFT v2. Supersedes v1 before any data exists. v1's validity gate compared
# periodic and aperiodic responses, which fails by construction at long N
# (about 8 pulses at N = 4096). v2 uses a lock-in signal-to-noise gate instead.
# Every value is a proposal until Keenan seals this file with scripts/seal.sh.

id: c1-glimmer-frequency-response-v2
version: 2
supersedes: c1-glimmer-frequency-response (v1), before any data
drafted: 2026-10-26
status: draft

questions:
  C1: Does Muse Glimmer-30B show a resonance, or a low-pass cutoff, in its response to periodic pulses?
  C1b: Does the curve recover Glimmer's built-in 2,048-token sliding window, separating local layers from global ones?

platform:
  model: meta-models/Muse-Glimmer-30B
  revision: cec94fcfd651            # full hash in /workspace/weights/DOWNLOAD_LOG.txt
  loader: AutoModelForMultimodalLM
  precision: bfloat16               # no quantization_config
  attention: sdpa
  transformers: "5.21.0"
  torch: "2.8.0+cu128"
  gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
  batch_size: 1                     # every pass, so unpulsed and pulsed runs use identical kernels
  deterministic: torch.use_deterministic_algorithms(True, warn_only=True), CUBLAS_WORKSPACE_CONFIG=:4096:8, fixed seeds
  preflight_must_pass: [dtype_bf16, no_quantization, sdpa, batch_size_1, revision_match, versions_match, gpu_match, seal_hash_match, text_hash_match]

inputs:
  length_tokens: 32768
  start: first token of the main text, after the Project Gutenberg header is stripped
  prompt_sets:                      # 3 independent sets, 5 public-domain books each, no author shared across sets
    # Project Gutenberg ebook IDs. Text = body between the *** START and *** END markers.
    A: {1342: Pride and Prejudice, 2701: Moby Dick, 1400: Great Expectations, 145: Middlemarch, 1184: The Count of Monte Cristo}
    B: {1260: Jane Eyre, 768: Wuthering Heights, 345: Dracula, 84: Frankenstein, 25344: The Scarlet Letter}
    C: {37106: Little Women, 74: The Adventures of Tom Sawyer, 120: Treasure Island, 174: The Picture of Dorian Gray, 940: The Last of the Mohicans}
  token_counts_checked: 2026-10-26, shortest 94,774 tokens (Treasure Island), all at least 33,792
  text_manifest: /workspace/data/books/MANIFEST.json
  text_sha256:                      # gutenberg_id -> sha256 of the stripped text, from the manifest
    1342: cb7c0d9af2041d31e655fafe79becb0877c3fc775690c7a558eb8707035e5138
    2701: 6b74a36cf4b629ac137c8832b2ba2be071a02c348f3accde0c026a893a2f30eb
    1400: c6196113039a054e075999518fd4f081838335b58cc0371f04b99080de03e7fe
    145: 9d0ce5c0b701c05b38198f6fab45b8ebf2eb3645a81aa55794ccd0aa66cdaf0d
    1184: ea17c0e73310be451ea977324ff72be950aa63ae76b95eac946386cfb8f97045
    1260: 67453a6d7b7ebe4c3f4525bea71e5564ca1562eb4c62c01e8e086d65370627e1
    768: d23b4feab29dcfa7411bbb8041e825dd48e3e1c1721c61c392ccfb46968fd6fd
    345: f20fc68a26f548cbc0c7ea33129b0d65dffb6cbd9f5d382fde64837dea445fc3
    84: 3839fa35c116713f811903545470041a86079268307ae9fd3ed4d04c88788bc0
    25344: 47e262c46b86b85f8cb5f830366396dc47f9c4e0a2ab7625390231afa290111a
    37106: c0e400eaac9e8e3306ab46909e17a94689237c05ebcb86266708f4a033f2be09
    74: 02cf604599664a5fb5853d144b3488ff8df4953bf66f63b1aa8bf948ad07528a
    120: ce5b10ab3756b36db3a037c8c412e5835e4095cd1059ddf02ea4a3c2add776bc
    174: 1311e14e3576ced84f2760043afc85194eabdd2db55d2c59b957299eb65075a6
    940: 0cc61502739d626dc42149e72639e49367726f7dd703d0eef0cbbe20ab4b34d9
  provenance: the run refuses to start if any book's text hash differs from text_sha256
  reserved_for_C3_and_knob_gates: never used in C1; chosen in the C3 file

pulse:
  injection_point: residual stream output of decoder layer 1
  measured_layers: 2 to 51 (37 local, 13 global)
  direction: one fixed random unit vector in the 6,656-dim residual space, seed 0
  amplitude_rule: >
    Linearity check (Phase A) on one book from set A at N = 16 and N = 1024.
    Candidates a in [0.01, 0.02, 0.05, 0.1] times the median residual-stream norm
    at layer 1 on the unpulsed run. Choose the largest a for which doubling it
    doubles the measured gain within 10 percent at both N. If none qualifies, stop:
    C1 is not run.
  positions: every N tokens, starting at a random offset in [0, N), seed 0
  interval_grid_N: [2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048, 3072, 4096]
  controls:
    sham: amplitude 0, one pass per book; the response must be exactly zero at every head, or the run stops (hook and determinism check)
    aperiodic: same number of pulses at random positions (seed 1); reported as a time-invariance cross-check, not a pass gate

measurement:
  read_point: forward pre-hook on self_attn.o_proj (gated head outputs, 32 heads x 128)
  response: pulsed minus unpulsed head output, per head, per token
  analysis_window: tokens 1024 to 32767 (first 1,024 tokens excluded as warm-up)
  gain: >
    For each head, the norm of the response's discrete Fourier component at
    frequency 1/N along the token axis, divided by the same component of the
    input pulse train. Computed inside the hook; only per-head gains are stored.
  noise_floor: >
    For each head, the median magnitude of the response's Fourier components at
    the 16 frequency bins nearest the target bin k0 = W/N (W = window length, 31,744
    tokens), excluding bins within 1 of any multiple of k0.
  snr: target component magnitude divided by the noise floor, per head
  validity: a grid point counts only if the median SNR over all measured heads is at least 3
  aperiodic_gain: >
    The aperiodic run's component at 1/N divided by its own pulse train's component
    at 1/N. Reported beside the periodic gain; agreement within a factor of 2 is
    reported as evidence of time invariance. Not a pass gate.
  curves:
    whole_model: mean gain over all heads in layers 2 to 51, per N
    local: mean over heads in local layers
    global: mean over heads in global layers
    normalization: each curve divided by its own maximum, per prompt set

statistic: Spearman rank correlation for shape agreement; bootstrap over books (1,000 resamples) for 95 percent intervals

pass_criteria:
  C1:
    outcome_R_resonance: >
      On all 3 prompt sets, the whole-model curve's maximum is at an interior grid
      point (not the two shortest or two longest N), it is at least 1.5x the curve's
      median, and the three peak locations fall within one grid step of each other.
    outcome_L_cutoff: >
      Not R, and on all 3 prompt sets the normalized whole-model gain falls below 0.5
      of its plateau (mean of the three shortest N) within the grid. The cutoff period
      N_c is the log-interpolated crossing. The three N_c values agree within a factor of 1.5.
    outcome_H_highpass: Not R, and gain rises with N on all 3 sets (Spearman rho of gain vs N at least 0.8 on each). Reported as found.
    outcome_F_flat: none of the above, or fewer than half the grid points pass validity
    shape_replication: Spearman rho between every pair of set curves at least 0.8, reported for all outcomes
  C1b:
    pass: >
      Averaged over the three prompt sets, at N = 3072 and 4096 the normalized local
      curve is at most 0.25 and the normalized global curve is at least 0.5.
    fail_action: Report that the instrument did not resolve the window; the demo leads with the whole-model curve.

decisions:
  R_or_L_or_H: Gate 1 passes; continue to C2 with the outcome as the story
  F: kill rule; switch the submission to the autonomous interpretability lab on public targets
  no_rescue: NF4, eager attention, other input lengths or other models cannot be used to rescue a failed C1

budget:
  max_gpu_hours: 4
  max_cost_usd: 12
  estimate: 15 books x (1 unpulsed + 1 sham + 23 periodic + 23 aperiodic) passes x 12.7 s, about 2.5 GPU hours, plus Phase A

outputs:
  raw: results/raw/<run_id>/ (per-head gains per book, per N, per condition; run record with versions and text hashes)
  derived: results/derived/<run_id>/ (curves, outcome, intervals), each citing its raw files
